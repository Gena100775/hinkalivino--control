# Preparation only. Do not create resources before reviewing SECURITY.md.
databases:
  - name: hv-control-staging-db
    databaseName: hv_control_staging
    user: hv_app
    plan: basic-256mb
    ipAllowList: []
services:
  - type: pserv
    name: hv-control-staging
    runtime: python
    plan: starter
    autoDeployTrigger: 'off'
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port 10000 --workers 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hv-control-staging-db
          property: connectionString
      - key: HV_ENV
        value: production
      - key: HV_RELEASE_APPROVED
        value: 'false'
      - key: HV_ADMIN_PASSWORD
        sync: false
      - key: HV_ALLOWED_HOSTS
        sync: false
