# Plan only. Do not approve or deploy until SECURITY.md release gates are cleared.
# PostgreSQL is hosted on Neon Free; never place its credentials in this file.
services:
  - type: web
    name: hv-control-free-staging
    runtime: python
    region: frankfurt
    plan: free
    autoDeployTrigger: 'off'
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: HV_ENV
        value: production
      - key: HV_RELEASE_APPROVED
        value: 'false'
      - key: HV_ADMIN_PASSWORD
        sync: false
      - key: HV_ALLOWED_HOSTS
        sync: false
